---
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    # the editor bundle ships to integrations: runtime packages are fixes, tools are chores
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"
    ignore:
      # React 18 changes the render API; the reuse container list moves with the 4.0 editor
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # PHPUnit 12 needs PHP 8.3; the tests run on the minimum, PHP 8.2
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
